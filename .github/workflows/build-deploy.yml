name: Build to deploy folder

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${UNITY_LICENSE:-}" ] || { echo "UNITY_LICENSE is empty"; exit 1; }
          [ -n "${UNITY_EMAIL:-}" ] || { echo "UNITY_EMAIL is empty"; exit 1; }
          [ -n "${UNITY_PASSWORD:-}" ] || { echo "UNITY_PASSWORD is empty"; exit 1; }

          # UNITY_LICENSE should look like a ULF xml payload for personal license.
          if ! printf '%s' "$UNITY_LICENSE" | grep -q "<"; then
            echo "UNITY_LICENSE does not look like ULF content. Re-copy full .ulf text into secret."
            exit 1
          fi

          # GameCI docs note some special-character passwords can fail in CI auth.
          if printf '%s' "$UNITY_PASSWORD" | grep -Eq '[^A-Za-z0-9]'; then
            echo "WARNING: UNITY_PASSWORD contains special characters; GameCI auth may fail."
            echo "If 401 continues, try a temporary alphanumeric-only Unity password and retry."
          fi

      - name: Ensure deploy folder exists (repo root)
        run: mkdir -p deploy

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: VolleyballGame/Library
          key: Library-${{ runner.os }}-${{ hashFiles('VolleyballGame/Assets/**', 'VolleyballGame/Packages/**', 'VolleyballGame/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Prepare Unity log folder
        shell: bash
        run: mkdir -p VolleyballGame/Builds/Logs

      - name: Build Unity (WebGL)
        id: unity_build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: VolleyballGame
          targetPlatform: WebGL
          buildName: VolleyballGame
          buildsPath: deploy
          # Force Unity to write logs into the repo so we can read/upload them.
          customParameters: -logFile /github/workspace/VolleyballGame/Builds/Logs/Editor.log -stackTraceLogType Full

      - name: Dump Unity Editor log (tail)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES=(
            "VolleyballGame/Builds/Logs/Editor.log"
            "Builds/Logs/Editor.log"
          )

          FOUND=""
          for p in "${CANDIDATES[@]}"; do
            if [ -f "$p" ]; then
              FOUND="$p"
              break
            fi
          done

          if [ -n "$FOUND" ]; then
            echo "--- tail $FOUND ---"
            tail -n 200 "$FOUND" || true
          else
            echo "Unity Editor.log not found in expected locations."
            find . -maxdepth 6 -type f -name 'Editor.log' -print || true
          fi

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            VolleyballGame/Builds/Logs/**
            Builds/Logs/**

      - name: Copy build output to deploy root
        run: |
          set -eux
          rm -rf deploy/output_tmp
          mkdir -p deploy/output_tmp

          if [ -d "deploy/WebGL/VolleyballGame" ]; then
            cp -a deploy/WebGL/VolleyballGame/. deploy/output_tmp/
          elif [ -d "VolleyballGame/deploy/WebGL/VolleyballGame" ]; then
            cp -a VolleyballGame/deploy/WebGL/VolleyballGame/. deploy/output_tmp/
          else
            echo "Build output folder not found."
            ls -la
            ls -la deploy || true
            ls -la VolleyballGame/deploy || true
            exit 1
          fi

          find deploy -mindepth 1 -maxdepth 1 ! -name output_tmp -exec rm -rf {} +
          cp -a deploy/output_tmp/. deploy/
          rm -rf deploy/output_tmp

      - name: Commit deploy artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update deploy artifacts [skip ci]"
          file_pattern: deploy/**
